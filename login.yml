info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/public/login"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "secret123"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: let email = bru.getCollectionVar("email");
    - type: after-response
      code: |-
        test ("verifier le code 200 ", ()=>{
          let response = res.getStatus();
          expect(response).to.equal(200);
          
          
        })

        test ("verifier que le token existe", ()=>{
          
          let body = res.getBody();
          expect(body).to.have.property("token");
          bru.setCollectionVar("tokenn", body.token);
         
          
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
